<svg xmlns="http://www.w3.org/2000/svg" width="360" height="560" viewBox="0 0 360 560">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbff"/><stop offset=".5" stop-color="#cad8e4"/><stop offset="1" stop-color="#8295a7"/></linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d13b49"/><stop offset=".55" stop-color="#9c2032"/><stop offset="1" stop-color="#501522"/></linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#dfe8ee"/><stop offset="1" stop-color="#8c9aa6"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".3" stop-color="#bfe7ff"/><stop offset=".7" stop-color="#778c9f"/><stop offset="1" stop-color="#eefaff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#05101d" flood-opacity=".42"/></filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- cape -->
    <path d="M164 187 C118 190 76 219 35 252 C79 261 72 292 17 337 C82 334 126 311 166 278 C186 256 190 219 164 187Z" fill="url(#cape)" stroke="#5d1420" stroke-width="5"/>
    <path d="M121 211 C89 235 66 250 39 259" fill="none" stroke="#f06c75" stroke-width="4" opacity=".45"/>
    <!-- back hair strands -->
    <path d="M160 139 C106 136 90 180 45 186 C77 207 115 199 151 177Z" fill="url(#hair)" stroke="#8193a4" stroke-width="4"/>
    <path d="M162 151 C105 169 88 220 44 222 C86 239 125 216 161 190Z" fill="url(#hair)" stroke="#8193a4" stroke-width="4" opacity=".96"/>
    <path d="M160 165 C121 205 117 243 79 259 C126 260 156 234 177 196Z" fill="url(#hair)" stroke="#8193a4" stroke-width="4" opacity=".9"/>
